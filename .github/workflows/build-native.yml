name: Build Native Windows App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-native:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Native C++ Win32 Executable
        working-directory: native
        run: |
          rc.exe resource.rc
          cl.exe /O2 /W3 /EHsc /std:c++17 main.cpp resource.res /link /SUBSYSTEM:WINDOWS /OUT:ShortcutOverlay.exe user32.lib gdi32.lib gdiplus.lib shell32.lib
          dir ShortcutOverlay.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutOverlay-Native-x64
          path: native/ShortcutOverlay.exe
          if-no-files-found: error

      - name: Create Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: native/ShortcutOverlay.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
